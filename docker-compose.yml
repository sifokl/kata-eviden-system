services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: eviden-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import

  books-api-factice:
    build:
      context: ./books-api-factice
      dockerfile: Dockerfile
    container_name: eviden-books-api-factice
    ports:
      - "8082:8082"

  auth-gateway:
    build:
      context: ./gateway-authent
      dockerfile: Dockerfile
    container_name: eviden-auth-gateway
    ports:
      - "8081:8081"
      - "5005:5005"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/eviden-kata
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/eviden-kata/protocol/openid-connect/certs
      GATEWAY_BACKEND_BASE_URL: http://books-api-factice:8082
    depends_on:
      - keycloak
      - books-api-factice