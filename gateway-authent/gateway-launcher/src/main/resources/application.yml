server:
  port: 8081
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/eviden-kata/protocol/openid-connect/certs
management:
  endpoints:
    web:
      exposure:
        include: health,info
gateway:
  backend:
    base-url: http://localhost:8090
    resource:
      public-path: /api/library/public/books
      members-path: /api/library/members/books
      admin-path: /api/library/admin/books

  token:
    propagation-token-mode: RELAY

  security:

    public-endpoints:
      - /actuator/health
      - /actuator/info
      - /public/books
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**

    route-authorizations:

      - pattern: /api/me
        access: AUTHENTICATED

      - pattern: /members/books
        access: HAS_ANY_ROLE
        roles:
          - USER
          - ADMIN

      - pattern: /admin/books
        access: HAS_ROLE
        roles:
          - ADMIN